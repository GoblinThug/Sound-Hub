<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=748, initial-scale=1" />
  <title>SoundHub</title>
  <link rel="stylesheet" href="styles/popup.css" />
</head>
<body>
  <div class="fs-viewport">
  <div class="app">
    <header class="app-header">
      <h1>SoundHub</h1>
      <a
        id="contactInfo"
        class="author-badge"
        href="https://github.com/GoblinThug"
        target="_blank"
        rel="noopener noreferrer"
        title="Goblin Thug on GitHub"
      >Goblin Thug</a>
      <div id="lt" class="subtitle" hidden></div>
    </header>
    <div id="eqThisTabDiv" class="action-bar">
      <button id="vizButton" class="btn btn-spectrum on" type="button" data-i18n="spectrum" data-i18n-title="spectrumTitle">Visualizer</button>
      <button id="eqTabButton" type="button" class="btn-eq" data-i18n="eqStart" data-i18n-title="eqStartTitle">EQ This Tab</button>
    </div>
    <section class="workspace" data-i18n-aria="workspaceAria" aria-label="Main workspace">
      <div id="mainDiv" class="workspace-main">
        <input id="tab-1" type="radio" name="tab-group" checked="checked" />
        <label id="label-1" for="tab-1" data-i18n="tabControls">Controls</label>
        <input id="tab-2" type="radio" name="tab-group" />
        <label for="tab-2" data-i18n="tabGuide">Guide</label>
        <input id="tab-3" type="radio" name="tab-group" />
        <label for="tab-3" data-i18n="tabActive">Active Tabs</label>
        <div id="eqDiv" class="panel panel-eq">
          <div class="eq-stage">
            <div class="gain-column">
              <span class="gain-label" aria-hidden="true">vol</span>
              <canvas id="gainCanvas" width="30" height="300" data-i18n-aria="masterVolume" aria-label="Master volume"></canvas>
            </div>
            <canvas id="eqCanvas" width="654" height="300" data-i18n-aria="equalizer" aria-label="Equalizer"></canvas>
          </div>
        </div>
        <div id="guideDiv" class="panel panel-guide prose" data-i18n-html="guideHtml"></div>
        <div id="tabsDiv" class="panel panel-tabs">
          <div id="eqTabList"></div>
        </div>
      </div>
    </section>
    <section class="controls-dock" data-i18n-aria="presetsDock" aria-label="Presets and tools">
      <div id="filterButtonsDiv" class="dock-row dock-row-tools">
        <div class="preset-field">
          <input
            id="presetNameInput"
            type="text"
            spellcheck="false"
            autocomplete="off"
            data-i18n-placeholder="presetName"
            data-i18n-aria="presetName"
            placeholder="Preset name"
            aria-label="Preset name"
          />
        </div>

            id="fullscreenButton"
            class="btn btn-icon btn-fullscreen"

          <div id="settingsPanel" class="settings-panel" hidden>
            <div class="settings-panel-head" data-i18n="settingsHead">Settings</div>
            <div class="settings-body">
              <label class="settings-row">
                <span data-i18n="spectrumToggle">Visualizer</span>
                <input id="settingsSpectrumToggle" class="ui-switch" type="checkbox" />
              </label>
              <div class="settings-theme">
                <span class="settings-theme-label" data-i18n="colorTheme">Color theme</span>
                <div id="settingsThemePicker" class="theme-picker" role="radiogroup" data-i18n-aria="colorTheme" aria-label="Color theme"></div>
              </div>
              <div class="settings-lang">
                <span class="settings-theme-label" data-i18n="language">Language</span>
                <div id="settingsLangPicker" class="lang-picker" role="radiogroup" data-i18n-aria="language" aria-label="Language"></div>
              </div>
              <div class="settings-actions">
                <button id="settingsGuideButton" type="button" class="settings-action" data-i18n="openGuide">Open guide</button>
              </div>
            </div>
            <div class="settings-meta">SoundHub · v<span id="settingsVersion">—</span></div>
          </div>
        </div>
        <input type="file" id="importPresetsFile" accept=".json,application/json" />
      </div>
      <div id="presetDiv" class="dock-row dock-row-presets">
        <span class="dock-title" data-i18n="presets">Presets</span>
        <div class="preset-scroll-wrap">
          <div class="preset-scroll" role="list" data-i18n-aria="savedPresets" aria-label="Saved presets">
            <button id="bassBoostButton" type="button" class="btn preset-chip-fixed" data-i18n="bassBoost" data-i18n-title="bassBoostTitle" title="Apply bass boost preset">
              Bass Boost
            </button>
            <span id="userPresetSpan" class="preset-chips"></span>
          </div>
        </div>
      </div>
    </section>
  </div>
  </div>
  <div id="requiresProDiv" hidden></div>
  <script src="js/i18n.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/eq-canvas.js"></script>
  <script src="js/preset-import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
